<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App share bài</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--xanh:#004AEF;--xanh2:#0D53F0;--navy:#002992;--mint:#07EF9C;--cam:#F68B1F;--vang:#FFCE00;--den:#151515;--xam:#F3F3F6;--vien:#DCDCDC;--phu:#5A6B66;--do:#D93025}
*{box-sizing:border-box}
body{margin:0;font-family:Gilroy,Montserrat,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--den);background:var(--xam);font-size:15px;line-height:1.55}
a{color:var(--xanh)}
header{background:#fff;border-bottom:1px solid var(--vien);position:sticky;top:0;z-index:5}
.top{max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px;padding:10px 16px;flex-wrap:wrap}
.top img{width:150px;height:auto}
.top h1{font-size:18px;margin:0;color:var(--navy);font-weight:800}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;color:var(--phu);cursor:pointer}
nav button.on{background:var(--xanh);color:#fff}
main{max-width:1180px;margin:auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--vien);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:22px;margin:0 0 6px;color:var(--navy)}
h3{font-size:17px;margin:0 0 8px}
.mo{color:var(--phu);font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stat{background:#fff;border:1px solid var(--vien);border-radius:14px;padding:14px}
.stat b{display:block;font-size:30px;color:var(--xanh);font-weight:800;line-height:1.2}
.stat.mint b{color:#03a86c}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--vien);border-radius:9px;background:#fff}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
button.b{border:0;background:var(--xanh);color:#fff;font:inherit;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer}
button.b.phu{background:#fff;color:var(--xanh);border:1px solid var(--xanh)}
button.b.nho{padding:5px 10px;font-size:13px}
button.b.do{background:var(--do)}
button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 200px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--vien);vertical-align:top}
th{background:var(--xam);font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--xam);white-space:nowrap}
.t-da_dang{background:#d9fbe9;color:#05734a}.t-cho{background:#e6edff;color:var(--xanh)}.t-loi{background:#fde3e1;color:var(--do)}.t-tam_giu{background:#fff4cc;color:#8a6d00}.t-dang{background:#ffe9d1;color:#9a4f00}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:6px 0 8px 36px}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--xanh);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.go{display:inline-block;margin:4px 6px 0 0;padding:4px 10px;border-radius:7px;background:#e6edff;color:var(--xanh);font-weight:700;font-size:13px;text-decoration:none}
.go:after{content:" ↗"}
.copy{display:flex;gap:6px;align-items:center;background:var(--xam);border-radius:8px;padding:6px 8px;font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;margin-top:4px}
.copy button{flex:none}
.plat{display:flex;gap:8px;flex-wrap:wrap}
.plat button{border:1px solid var(--vien);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.plat button:hover{border-color:var(--xanh);color:var(--xanh)}
.ok{color:#05734a;font-weight:600}.err{color:var(--do);font-weight:600}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;display:none;z-index:9;max-width:90vw}
.login{max-width:420px;margin:60px auto}
.conn-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0}
.chk input{width:auto}
canvas{max-width:100%;border-radius:10px;border:1px solid var(--vien)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><div class="top">
  <img src="/logo.webp" alt="SEONGON">
  <h1>App share bài</h1>
  <nav id="nav" class="hide">
    <button data-v="baocao">Báo cáo</button><button data-v="hangdoi">Hàng đợi</button><button data-v="them">Thêm bài</button>
    <button data-v="ketnoi">Kết nối</button><button data-v="caidat">Cài đặt</button><button data-v="nhatky">Nhật ký</button>
  </nav>
</div></header>
<main id="app"></main>
<div id="toast"></div>

<script>

    buoc: [
      ['Mở trang tạo ứng dụng WordPress.com (đăng nhập đúng tài khoản sở hữu blog).', [['Tạo app WordPress.com', 'https://developer.wordpress.com/apps/new/'], ['Danh sách app của bạn', 'https://developer.wordpress.com/apps/']]],
      ['Điền: <b>Name</b> = app share bai · <b>Website URL</b> = địa chỉ app · <b>Redirect URLs</b> = địa chỉ trả về · <b>Type</b> = Web. Tích ô xác nhận rồi bấm <b>Create</b>.', null, ['O', 'R']],

      ['Bấm <b>Lưu</b> rồi <b>Đăng nhập & cấp quyền</b> → chọn blog → <b>Approve</b>. App tự quay lại và kiểm tra.'],

      ['Bật 2 dịch vụ: Blogger (đăng bài) và Google Sheets (ghi link về sheet). Mỗi trang bấm <b>Enable</b>.', [['Bật Blogger API', 'https://console.cloud.google.com/apis/library/blogger.googleapis.com'], ['Bật Google Sheets API', 'https://console.cloud.google.com/apis/library/sheets.googleapis.com']]],
      ['Khai màn hình đồng ý: điền tên app + email → <b>Audience: External</b> → thêm email của bạn vào <b>Test users</b>. Sau đó vào mục Audience bấm <b>Publish app</b> để chìa <b>không hết hạn sau 7 ngày</b>.', [['Màn hình đồng ý (Branding)', 'https://console.cloud.google.com/auth/branding'], ['Mục Audience (Publish app)', 'https://console.cloud.google.com/auth/audience']]],
      ['Tạo chìa: <b>Application type = Web application</b> → mục <b>Authorized redirect URIs</b> bấm Add URI, dán địa chỉ trả về → <b>Create</b> → chép Client ID và Client Secret vào 2 ô dưới.', [['Tạo chìa OAuth', 'https://console.cloud.google.com/auth/clients/create']], ['R']],
      ['Bấm <b>Lưu</b> rồi <b>Đăng nhập & cấp quyền</b> → chọn tài khoản Google sở hữu blog → nếu báo "chưa xác minh" bấm <b>Nâng cao → Đi tới…</b> → <b>Cho phép</b>. App tự lấy blog đầu tiên; muốn blog khác thì điền Blog ID.'],
    ],
    o: [['name', 'Tên gợi nhớ', 'Blogger - tenblog'], ['client_id', 'Client ID', '….apps.googleusercontent.com'], ['client_secret', 'Client Secret', '', 1], ['blog_id', 'Blog ID (để trống — app tự lấy)', '']] },
  ggroups: { ten: 'Google Groups', oauth: true,
    buoc: [
      ['Tài khoản Gmail dùng để đăng phải <b>là thành viên của nhóm</b> và được phép đăng bài không cần duyệt. Mở trang nhóm kiểm tra (chưa tham gia thì bấm <b>Tham gia nhóm</b>).', [['Mở nhóm techcombank-viet-nam', 'https://groups.google.com/g/techcombank-viet-nam']]],
      ['Dùng lại dự án Google Cloud của Blogger (hoặc tạo mới), bật <b>Gmail API</b> → <b>Enable</b>.', [['Bật Gmail API', 'https://console.cloud.google.com/apis/library/gmail.googleapis.com'], ['Tạo dự án mới (nếu chưa có)', 'https://console.cloud.google.com/projectcreate']]],
      ['Màn hình đồng ý: thêm email của bạn vào <b>Test users</b>, rồi <b>Publish app</b> để chìa không hết hạn sau 7 ngày.', [['Màn hình đồng ý', 'https://console.cloud.google.com/auth/branding'], ['Mục Audience (Publish app)', 'https://console.cloud.google.com/auth/audience']]],
      ['Tạo chìa (hoặc dùng lại chìa Web của Blogger): <b>Web application</b> → <b>Authorized redirect URIs</b> dán địa chỉ trả về → <b>Create</b> → chép Client ID / Client Secret vào ô dưới.', [['Tạo chìa OAuth', 'https://console.cloud.google.com/auth/clients/create'], ['Danh sách chìa đã có', 'https://console.cloud.google.com/auth/clients']], ['R']],
      ['Ô "Địa chỉ đăng bài của nhóm" điền <code>tennhom@googlegroups.com</code>. Bấm <b>Lưu</b> → <b>Đăng nhập & cấp quyền</b> → chọn đúng Gmail thành viên nhóm → <b>Cho phép</b>.'],
    ],
    o: [['name', 'Tên gợi nhớ', 'GG Group - techcombank-viet-nam'], ['client_id', 'Client ID', '….apps.googleusercontent.com'], ['client_secret', 'Client Secret', '', 1], ['group_email', 'Địa chỉ đăng bài của nhóm', 'techcombank-viet-nam@googlegroups.com']] },
  webflow: { ten: 'Webflow', oauth: false,
    buoc: [
      ['Mở bảng điều khiển Webflow → di chuột vào trang → ⚙ <b>Settings</b> → <b>Apps & integrations</b> → kéo xuống <b>API access</b> → <b>Generate API token</b>. Tích <b>CMS: Read and write</b> và <b>Sites: Read</b> → chép token.', [['Mở Webflow Dashboard', 'https://webflow.com/dashboard']]],
      ['Lấy <b>Collection ID</b>: mở Designer → biểu tượng CMS → bộ sưu tập bài viết (vd Blog Posts) → ⚙ Settings → chép <b>Collection ID</b>.'],
      ['<b>Link đầu bài</b>: mở 1 bài bất kỳ trên trang, chép phần trước tên bài, vd <code>https://tenban.webflow.io/blog-posts/</code>.'],
      ['Bấm <b>Lưu & kiểm tra</b>. Lưu ý gói miễn phí chỉ chứa tối đa 50 bài.'],
    ],
    o: [['name', 'Tên gợi nhớ', 'Webflow - tenban'], ['token', 'API token', '', 1], ['collection_id', 'Collection ID', ''], ['url_prefix', 'Link đầu bài', 'https://tenban.webflow.io/blog-posts/']] },
  tumblr: { ten: 'Tumblr', oauth: true,
    buoc: [
      ['Mở trang đăng ký ứng dụng Tumblr → <b>Register application</b>.', [['Đăng ký app Tumblr', 'https://www.tumblr.com/oauth/register']]],
      ['Điền: Application name = app share bai · <b>Application website</b> = địa chỉ app · <b>Default callback URL</b> và <b>OAuth2 redirect URLs</b> = địa chỉ trả về · email của bạn → <b>Register</b>.', null, ['O', 'R']],
      ['Chép <b>OAuth Consumer Key</b> vào ô Client ID, <b>Secret Key</b> vào ô Client Secret.', [['Danh sách app Tumblr', 'https://www.tumblr.com/oauth/apps']]],
      ['Bấm <b>Lưu</b> rồi <b>Đăng nhập & cấp quyền</b> → <b>Allow</b>.'],
    ],
    o: [['name', 'Tên gợi nhớ', 'Tumblr - tenblog'], ['client_id', 'Client ID (OAuth Consumer Key)', ''], ['client_secret', 'Client Secret', '', 1], ['blog', 'Tên blog (để trống — app tự lấy)', 'tenblog']] },
  mastodon: { ten: 'Mastodon', oauth: false,
    buoc: [
      ['Điền <b>máy chủ</b> của bạn (vd mastodon.social) vào ô bên dưới, rồi bấm nút để mở trang tạo ứng dụng.', [['Tạo app trên mastodon.social', 'https://mastodon.social/settings/applications/new']]],
      ['Application name = app share bai · chỉ cần tích <b>read:accounts</b> và <b>write:statuses</b> → <b>Submit</b>.'],
      ['Bấm vào app vừa tạo → chép <b>Your access token</b> → dán vào ô dưới → <b>Lưu & kiểm tra</b>. Mastodon đăng tút ngắn (tiêu đề + tóm tắt + link bài gốc).'],
    ],
    o: [['name', 'Tên gợi nhớ', 'Mastodon - @ten'], ['instance', 'Máy chủ', 'mastodon.social'], ['token', 'Access token', '', 1]] },
  telegram: { ten: 'Telegram', oauth: false,
    buoc: [
      ['Mở BotFather → gõ <code>/newbot</code> → đặt tên → BotFather gửi <b>token</b> → chép vào ô dưới.', [['Mở BotFather', 'https://t.me/BotFather']]],
      ['Thêm bot vào kênh của bạn với vai trò <b>Quản trị viên</b>, bật quyền <b>Đăng tin</b>.'],
      ['Ô Chat ID điền <code>@tenkenh</code> (kênh công khai) → <b>Lưu & kiểm tra</b>. Telegram đăng tin ngắn có link bài gốc.'],
    ],

// ======================= TIỆN ÍCH =======================
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let TOKEN = ''; try { TOKEN = localStorage.getItem('tok') || ''; } catch {}
let S = null, VIEW = 'baocao', EDIT = null;
function toast(m, ms = 3500) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
async function api(path, body) {
  const r = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'x-token': TOKEN }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== 'login') { TOKEN = ''; showLogin(); throw new Error('Cần đăng nhập lại'); }
  if (!r.ok) throw new Error(d.error || 'Lỗi ' + r.status);
  return d;
}
const vn = (iso) => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' }); };
const vnDay = (iso) => new Date(new Date(iso).getTime() + 7 * 3600e3).toISOString().slice(0, 10);
const slugify = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 70);
const ST = { cho: 'Chờ đến giờ', tam_giu: 'Tạm giữ', dang: 'Đang đăng', da_dang: 'Đã đăng', loi: 'Lỗi' };
const tag = (st) => `<span class="tag t-${st}">${ST[st] || st}</span>`;
const connName = (id) => (S.conns.find((c) => c.id === id) || {}).name || '(đã xóa)';
function copyBox(txt) { return `<div class="copy"><span style="flex:1">${esc(txt)}</span><button class="b nho" onclick="navigator.clipboard.writeText('${esc(txt)}');toast('Đã chép')">Chép</button></div>`; }
// "dd/mm/yyyy HH:MM" hoặc "HH:MM dd/mm/yyyy" -> ISO (giờ VN)
function parseVN(s) {
  s = String(s || '').trim(); if (!s) return new Date().toISOString();
  let m = s.match(/(\d{1,2}):(\d{2})\s+(\d{1,2})\/(\d{1,2})\/(\d{4})/) || null, d, mo, y, h, mi;
  if (m) [, h, mi, d, mo, y] = m; else { m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/); if (m) [, d, mo, y, h, mi] = m; }
  if (!m) { const t = Date.parse(s); return isNaN(t) ? null : new Date(t).toISOString(); }
  return new Date(Date.UTC(+y, +mo - 1, +d, +h - 7, +mi)).toISOString();
}

// ======================= ĐĂNG NHẬP =======================
async function showLogin() {
  $('#nav').classList.add('hide');
  const st = await fetch('/api/status').then((r) => r.json());
  $('#app').innerHTML = `<div class="card login"><h2>${st.setup ? 'Đăng nhập' : 'Tạo mật khẩu cho app'}</h2>
    <p class="mo">${st.setup ? 'Nhập mật khẩu bạn đã đặt.' : 'Lần đầu dùng: đặt mật khẩu riêng (ít nhất 6 ký tự) để chỉ bạn vào được app. Nhớ lưu lại mật khẩu này.'}</p>
    <label>Mật khẩu</label><input id="pw" type="password" autocomplete="current-password">
    <p><button class="b" id="go">${st.setup ? 'Vào app' : 'Tạo mật khẩu & vào app'}</button></p></div>`;
  const go = async () => { try { const d = await api(st.setup ? 'login' : 'setup', { password: $('#pw').value }); TOKEN = d.token; try { localStorage.setItem('tok', TOKEN); } catch {} boot(); } catch (e) { toast(e.message); } };
  $('#go').onclick = go; $('#pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}
async function boot() {
  if (!TOKEN) return showLogin();
  try { S = await api('state'); } catch (e) { return; }
  $('#nav').classList.remove('hide');
  const h = location.hash.match(/ketnoi=([\w]+)/); if (h) { VIEW = 'ketnoi'; history.replaceState(null, '', '/'); const c = S.conns.find((x) => x.id === h[1]); if (c) setTimeout(() => toast((c.ok ? '✅ ' : '⚠️ ') + c.test, 7000), 300); }
  render();
}
async function reload() { S = await api('state'); render(); }
$$('#nav button').forEach((b) => b.onclick = () => { VIEW = b.dataset.v; EDIT = null; render(); });
function render() {
  $$('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === VIEW));

function exportCSV() {

async function bulkImport() {
  const btn = $('#bulkgo'), raw = $('#bulk').value.trim(), hold = $('#bulk_hold').checked; if (!raw) return;
  btn.disabled = true;
  try {
    let rows;
    if (raw.startsWith('[')) rows = JSON.parse(raw);
    else rows = raw.split('\n').filter((l) => l.trim()).map((l) => { const c = l.split('\t'); return { title: c[0], source: c[1], html: c[2], conns: c[3], at: c[4], sheet_row: c[5] }; });
    const items = [], cv = document.createElement('canvas'); cv.width = 1200; cv.height = 630;
    for (const [i, r] of rows.entries()) {
      btn.textContent = `Đang chuẩn bị ${i + 1}/${rows.length}…`;
      let html = String(r.html || '').trim(); if (/^https?:\/\/\S+$/.test(html)) html = await fetch(html).then((x) => x.text());
      const names = String(r.conns || '').split(',').map((s) => s.trim().toLowerCase()).filter(Boolean);
      const cs = S.conns.filter((c) => names.includes(c.name.toLowerCase()));
      if (!cs.length) throw new Error(`Dòng ${i + 1}: không thấy kết nối tên "${r.conns}"`);
      let image = r.image; if (!image) { drawThumb(cv, r.title, r.label || S.settings.nhan_anh || 'Cẩm nang tài chính'); image = (await api('image', { data: cv.toDataURL('image/png') })).url; }
      const at = r.at ? parseVN(r.at) : new Date().toISOString(); if (!at) throw new Error(`Dòng ${i + 1}: giờ hẹn sai dạng`);
      items.push({ title: r.title, slug: r.slug || slugify(r.title), source: String(r.source).trim(), html, image, short: r.short || '',
        jobs: cs.map((c) => ({ conn: c.id, at, status: hold ? 'tam_giu' : 'cho', sheet_row: r.sheet_row || undefined, sheet_offset: r.sheet_row ? 0 : undefined })) });
    }
    const d = await api('items/import', { items }); toast(`Đã nhập ${d.n} bài`); VIEW = 'hangdoi'; await reload();
  } catch (e) { toast(e.message, 7000); }
  btn.disabled = false; btn.textContent = 'Nhập hàng loạt';
}
// Ảnh đại diện 1200×630: nền xanh chuyển màu + tiêu đề trắng + nhãn nhỏ
function drawThumb(cv, title, label) {
  const g = cv.getContext('2d'), W = 1200, H = 630, gr = g.createLinearGradient(0, 0, W, H);
  gr.addColorStop(0, '#002992'); gr.addColorStop(.6, '#0D53F0'); gr.addColorStop(1, '#0DD1FF');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalAlpha = .12; g.fillStyle = '#fff'; g.beginPath(); g.arc(1060, 120, 260, 0, 7); g.fill(); g.beginPath(); g.arc(1150, 560, 160, 0, 7); g.fill(); g.globalAlpha = 1;
  g.font = '700 30px Montserrat, Arial'; const lw = g.measureText(label).width + 44;
  g.fillStyle = '#07EF9C'; g.beginPath(); g.roundRect(80, 90, lw, 56, 28); g.fill(); g.fillStyle = '#002992'; g.fillText(label, 102, 129);
  g.fillStyle = '#fff'; let size = 68, lines;
  do { g.font = `800 ${size}px Montserrat, Arial`; lines = wrap(g, title, W - 170); size -= 4; } while (lines.length > 4 && size > 40);
  lines.forEach((l, i) => g.fillText(l, 80, 250 + i * (size + 18)));
}
function wrap(g, t, w) { const out = []; let cur = ''; for (const word of String(t).split(/\s+/)) { const tryL = cur ? cur + ' ' + word : word; if (g.measureText(tryL).width > w && cur) { out.push(cur); cur = word; } else cur = tryL; } if (cur) out.push(cur); return out; }

    if (type === 'wordpress' && data.site_id) data.site_id = data.site_id.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (type === 'mastodon' && data.instance) data.instance = data.instance.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    const name = $('#form input[data-k="name"]').value.trim() || p.ten;
    try {
      const d = await api('conn', { id: cid, type, name, data });
      if (!p.oauth) { const t = await api('conn/test', { id: d.id }); toast((t.ok ? '✅ ' : '⚠️ ') + t.msg, 7000); } else toast('Đã lưu. Giờ bấm "Đăng nhập & cấp quyền".', 6000);
      $('#form').innerHTML = ''; await reload();
    } catch (e) { toast(e.message, 6000); }
  };
}
async function testConn(id, btn) { btn.disabled = true; try { const t = await api('conn/test', { id }); toast((t.ok ? '✅ ' : '⚠️ ') + t.msg, 7000); await reload(); } catch (e) { toast(e.message); } btn.disabled = false; }
async function pauseConn(id, paused) { await api('conn/pause', { id, paused }); await reload(); }
async function delConn(id) { if (!confirm('Xóa kết nối này? Các bài đã đăng vẫn giữ nguyên trên trang.')) return; await api('conn/delete', { id }); await reload(); }
