<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ép index GSC</title>
<style>
  :root { --xanh: #004AEF; --mint: #07EF9C; --chu: #1a1f36; --nhat: #6b7280; --vien: #e5e7eb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--chu); background: #fff; }
  h1 { font-size: 18px; margin: 0 0 12px; color: var(--xanh); }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid var(--vien); border-radius: 6px; font: inherit; }
  textarea { height: 120px; font-size: 12px; }
  .hang { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  button { padding: 9px 14px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; background: var(--vien); color: var(--chu); }
  button.chinh { background: var(--xanh); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #trangthai { padding: 8px 10px; border-radius: 6px; background: #f3f6ff; margin: 8px 0; font-weight: 600; }
  #dem { color: var(--nhat); font-size: 13px; }
  #loi { height: 90px; background: #fff7f7; border-color: #f3c9c9; }
  #nhatky { height: 220px; overflow: auto; background: #0f172a; color: #e2e8f0; font: 12px/1.45 Consolas, monospace; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  .goiy { color: var(--nhat); font-size: 12px; }
</style>
</head>
<body>
<h1>Ép index Google Search Console</h1>
<p class="goiy">Mở sẵn trang Search Console của website trong Chrome này. Để nguyên tab đó, đừng đóng và đừng thu nhỏ cửa sổ.</p>

<label for="domain">Website (để trống = tự lấy website đang mở trong Search Console)</label>
<input id="domain" placeholder="ví dụ: example.com">

<label for="moc">Giờ publish — link Google đã đọc SAU giờ này sẽ được bỏ qua</label>
<input id="moc" type="datetime-local">

<label for="urls">Danh sách link (mỗi dòng 1 link)</label>
<textarea id="urls" placeholder="Dán danh sách link vào đây"></textarea>

<div class="hang">
  <button id="batdau" class="chinh">Bắt đầu</button>
  <button id="dung" disabled>Dừng</button>
  <button id="saochep">Sao chép kết quả</button>
  <button id="xoa">Xoá kết quả cũ</button>
</div>
<div id="trangthai">Chưa chạy</div>
<div id="dem"></div>

<label for="loi">Link chưa ép được — cần ép lại (<span id="soloi">0</span>)</label>
<textarea id="loi" readonly placeholder="Chưa có link lỗi"></textarea>
<div class="hang">
  <button id="saochep-loi">Sao chép link lỗi</button>
  <button id="ep-lai">Đưa link lỗi vào danh sách để ép lại</button>
</div>

<label>Nhật ký</label>
<div id="nhatky"></div>
<script src="runner.js"></script>
</body>
</html>
