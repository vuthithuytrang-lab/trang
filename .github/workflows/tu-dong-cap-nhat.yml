name: Cập nhật bài TCB tự động (không cần Claude)
# CHỈ CHẠY KHI CÓ NGƯỜI BẤM (Trang dặn 28/10/2026): app / Sheet "Update" tích ô → Apps Script ghi phiếu yêu cầu
# (file yeu-cau-tu-dong.json trong thư mục Drive chung). Việc "kiem" vài phút liếc phiếu 1 lần: không có phiếu mới → dừng
# ngay (vài giây, miễn phí); có phiếu mới → việc "chay" chạy đúng các bài trong phiếu, đăng kết quả lên nhánh tu-dong-ket-qua.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      bai: { description: 'Mã bài, cách nhau bằng dấu cách (để trống = đọc phiếu)', required: false, default: '' }
permissions:
  contents: write
# Không khóa cả workflow: nhiều người bấm cùng lúc thì các lượt chạy song song, bước đăng tự thử lại khi đụng nhau.
env:
  PHIEU: https://drive.usercontent.google.com/download?id=1wrO0bArJtokvfFvOzFNFqvJhrLrPD2VI&export=download
  KET_QUA: https://raw.githubusercontent.com/${{ github.repository }}/tu-dong-ket-qua/trang-thai.json
  NTFY: https://ntfy.sh/sn-tcb-cap-nhat-vttt-8q2m   # nút "Chạy cập nhật" trên trang công khai gửi yêu cầu vào đây (không cần chìa)
  DANH_SACH: https://raw.githubusercontent.com/${{ github.repository }}/claude/vibrant-keller-rk0i98/cong-cu/tu-dong/danh-sach.json
jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      bai: ${{ steps.p.outputs.bai }}
      ma: ${{ steps.p.outputs.ma }}
      ds: ${{ steps.p.outputs.ds }}
    steps:
      - id: p
        env: { BAI_TAY: '${{ inputs.bai }}' }
        # phiếu nằm ở thư mục Drive ai có link cũng sửa được → coi là dữ liệu lạ: chỉ nhận mã bài có trong danh sách,
        # mã phiếu đúng dạng yc-<số>; không bao giờ đưa chữ trong phiếu vào câu lệnh
        run: |
          curl -sfL -m 30 "$PHIEU" -o phieu.json || echo '{}' > phieu.json
          curl -sfL -m 30 "$DANH_SACH?t=$(date +%s)" -o ds.json || echo '{}' > ds.json
          curl -sfL -m 30 "$KET_QUA?t=$(date +%s)" -o tt.json || echo '{}' > tt.json
          curl -sfL -m 30 "$NTFY/json?poll=1&since=6h" -o nt.json || : > nt.json
          python3 - <<'EOF' >> $GITHUB_OUTPUT
          import json, os, re, time, datetime as d
          HOP_LE = {'gia-ca-phe', 'gia-xang-dau', 'vang-24k', 'vang-14k', 'vang-18k', 'vang-10k', '1-chi-vang', 'vang-16k', 'vang-610', 'lai-suat-1', 'lai-suat-2'}
          try:   # danh sách bài tự động mới nhất trong kho (chỉ nhận mã gồm chữ thường, số, gạch ngang)
              HOP_LE |= {v for v in json.load(open('ds.json')).values() if isinstance(v, str) and re.fullmatch(r'[a-z0-9-]{2,40}', v)}
          except Exception:
              pass
          tay = [b for b in os.environ.get('BAI_TAY', '').split() if b in HOP_LE]
          if tay:
              print('bai=' + ' '.join(tay)); print('ds=' + json.dumps(sorted(set(tay)))); print('ma=tay-%d' % time.time()); raise SystemExit
          try:
              tt = json.load(open('tt.json'))
          except Exception:
              tt = {}
          if not isinstance(tt, dict):
              tt = {}
          # 1) yêu cầu từ trang công khai (ntfy): mỗi dòng 1 sự kiện; chỉ nhận tin mới hơn tin đã xử lý (_ntfy = nt-<giờ>)
          cu = str(tt.get('_ntfy', ''))
          cu = int(cu[3:]) if re.fullmatch(r'nt-\d{1,12}', cu) else 0
          nt_bai, nt_moi = set(), 0
          for dong in open('nt.json', errors='replace'):
              try:
                  e = json.loads(dong); m = json.loads(e.get('message', '')) if isinstance(e, dict) and e.get('event') == 'message' else None
              except Exception:
                  continue
              t = e.get('time')
              if not isinstance(m, dict) or not isinstance(t, int) or t <= cu or not isinstance(m.get('bai'), list):
                  continue
              hop = {b for b in m['bai'] if isinstance(b, str) and b in HOP_LE}
              if hop:
                  nt_bai |= hop; nt_moi = max(nt_moi, t)
          if nt_bai:
              print('bai=' + ' '.join(sorted(nt_bai))); print('ds=' + json.dumps(sorted(nt_bai))); print('ma=nt-%d' % nt_moi); raise SystemExit
          # 2) phiếu Drive do Apps Script ghi
          try:
              p = json.load(open('phieu.json'))
          except Exception:
              raise SystemExit
          if not isinstance(p, dict):
              raise SystemExit
          ma = str(p.get('ma', ''))
          bai = [b for b in p.get('bai', []) if isinstance(b, str) and b in HOP_LE] if isinstance(p.get('bai'), list) else []
          moi = re.fullmatch(r'yc-\d{10,16}', ma) and bai and tt.get('_yeu_cau') != ma
          if moi:
              tuoi = time.time() - int(ma[3:]) / 1000
              moi = 0 <= tuoi < 3 * 3600                 # phiếu quá cũ thì bỏ (giờ lấy từ chính mã phiếu)
          if moi:
              print('bai=' + ' '.join(sorted(set(bai))))
              print('ds=' + json.dumps(sorted(set(bai))))
              print('ma=' + ma)
          EOF
          cat $GITHUB_OUTPUT
  chay:
    # mỗi bài 1 máy riêng chạy song song → bấm bao nhiêu bài thì mỗi bài vẫn xong trong ~2–3 phút
    needs: kiem
    if: needs.kiem.outputs.bai != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ma: ${{ fromJSON(needs.kiem.outputs.ds) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/vibrant-keller-rk0i98 }   # công thức mới nhất nằm ở nhánh này; nhánh chính chỉ giữ file lịch
      - name: Cài trình duyệt
        run: |
          npm i -g playwright@1.48.2
          npx -y playwright@1.48.2 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> $GITHUB_ENV
      - name: Chạy bài
        env: { MA: '${{ matrix.ma }}' }
        run: |
          mkdir -p ket-qua
          [ -d cong-cu/skill-cap-nhat-bai-tcb/cong-thuc/$MA ] || [[ $MA == lai-suat-[12] ]] || { echo "LỖI không có công thức $MA" > ket-qua/$MA.log; exit 0; }
          timeout 420 bash cong-cu/tu-dong/chay.sh $MA ket-qua > ket-qua/$MA.log 2>&1 || echo "LỖI $MA" >> ket-qua/$MA.log
          cat ket-qua/$MA.log
          # nguồn có lúc không hiện bảng (PNJ…) → nghỉ 20 giây chạy lại 1 lần; lần sau đọc đủ nguồn thì dùng lần sau
          if [ $MA != gia-ca-phe ] && grep -qE 'KHÔNG ĐỌC ĐƯỢC|KHÔNG đọc được|không đọc được|LỖI|Error' ket-qua/$MA.log; then
            sleep 20
            timeout 420 bash cong-cu/tu-dong/chay.sh $MA lai > lai.log 2>&1 || echo "LỖI $MA" >> lai.log
            echo "::group::chạy lại"; cat lai.log; echo "::endgroup::"
            if grep -q '^XONG' lai.log && ! grep -qE 'KHÔNG ĐỌC ĐƯỢC|KHÔNG đọc được|không đọc được|^LỖI|Error' lai.log; then
              rm -rf ket-qua/$MA; mv lai/$MA ket-qua/$MA; mv lai.log ket-qua/$MA.log
            fi
          fi
          find ket-qua -mindepth 2 ! -name bai.html -type f -delete   # chỉ giữ bai.html + log cho bước đăng
      - uses: actions/upload-artifact@v4
        with: { name: 'kq-${{ matrix.ma }}', path: ket-qua/, retention-days: 1 }
  dang:
    needs: [kiem, chay]
    if: always() && needs.kiem.outputs.bai != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/vibrant-keller-rk0i98 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'kq-*', merge-multiple: true, path: ket-qua }
      - name: Đăng kết quả lên nhánh tu-dong-ket-qua
        env: { MA: '${{ needs.kiem.outputs.ma }}' }
        run: |
          git config --global user.name "Cập nhật tự động"
          git config --global user.email "actions@users.noreply.github.com"
          for lan in 1 2 3 4 5; do                      # nhiều lượt cùng đăng → lấy bản mới nhất, gộp, đăng lại
            rm -rf xuat
            git clone -q --depth 1 -b tu-dong-ket-qua "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" xuat
            python3 -I cong-cu/tu-dong/tong_hop.py ket-qua xuat "$MA"
            git -C xuat add -A
            git -C xuat diff --cached --quiet && exit 0
            git -C xuat commit -qm "Kết quả $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')"
            git -C xuat push -q origin tu-dong-ket-qua && exit 0
            sleep $((lan * 5))
          done
          exit 1
