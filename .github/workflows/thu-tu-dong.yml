name: Thử chạy tự động (không cần Claude)
on:
  push:
    branches: [claude/vibrant-keller-rk0i98]
    paths: [.github/workflows/thu-tu-dong.yml, cong-cu/tu-dong/**]
  workflow_dispatch:
jobs:
  thu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cài trình duyệt
        run: |
          npm i -g playwright@1.48.2
          npx -y playwright@1.48.2 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> $GITHUB_ENV
      - name: Thử mở từng trang nguồn
        run: |
          for u in https://techcombank.com/thong-tin/blog/vang-24k https://www.pnj.com.vn/site/gia-vang https://banggia.doji.vn/gold-price https://webgia.com/gia-vang/sjc/ https://giacaphe.com/gia-ca-phe-truc-tuyen/ https://nhabeagri.com/gia-nong-san/gia-ca-phe/ https://topi.vn/gia-xang-dau-hom-nay.html https://www.petrolimex.com.vn https://www.mipec.com.vn/pages/gia-xang-dau-ban-le https://huythanhjewelry.vn/gia-vang-hom-nay https://phuquygroup.vn/ https://www.mihong.vn/gia-vang-trong-nuoc; do
            echo "$(curl -s -o /dev/null -m 30 -A Mozilla/5.0 -w '%{http_code}' -L $u) $u"; done
      - name: Chạy thử 9 bài có công thức
        run: |
          for m in vang-24k vang-14k vang-18k vang-10k vang-16k vang-610 1-chi-vang gia-ca-phe gia-xang-dau; do
            echo "::group::$m"; timeout 600 bash cong-cu/tu-dong/chay.sh $m ket-qua || echo "LỖI $m"; echo "::endgroup::"; done
          ls -la ket-qua/*/bai.html || true
      - uses: actions/upload-artifact@v4
        with: { name: ket-qua, path: ket-qua/*/bai.html, if-no-files-found: warn }
